name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Новый пуш в ветку отменяет предыдущий прогон — не жжём минуты впустую.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go mod tidy не меняет go.mod
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Тесты с детектором гонок
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Порог покрытия бизнес-логики
        run: ./scripts/coverage-gate.sh coverage.out 70

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  proto:
    name: Контракты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Менялись ли .proto
        run: |
          if [ -z "$(find proto -name '*.proto' -print -quit 2>/dev/null)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: bufbuild/buf-action@v1
        if: steps.changed.outputs.run == 'true'
        with:
          # breaking сравнивает с целевой веткой: сломать чужой контракт
          # молча не получится
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref || 'develop' }}"

  discover:
    name: Поиск сервисов
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      services: ${{ steps.find.outputs.services }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        # Матрица собирается из сервисов, у которых уже есть Dockerfile,
        # поэтому CI не надо править при появлении нового сервиса.
        run: |
          list=$(find services -mindepth 2 -maxdepth 2 -name Dockerfile \
                 | xargs -r -n1 dirname | xargs -r -n1 basename \
                 | sort | jq -R . | jq -sc .)
          echo "services=$list" >> "$GITHUB_OUTPUT"
          if [ "$list" = "[]" ] || [ -z "$list" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Образ ${{ matrix.service }}
    needs: [lint, test, discover]
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
