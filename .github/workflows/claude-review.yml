name: Ревью от Claude

# Ревью по запросу: повесь на PR метку claude-review. После ревью метка
# снимается сама — чтобы попросить ещё раз после правок, повесь её снова.
#
# Не на каждый PR, потому что бот работает на подписке ментора, и лимит у неё
# общий с его собственной работой.
#
# Метка, а не команда в комментарии: на событие pull_request GitHub сам
# запускает workflow на коде PR, а PR из форков секретов не получают.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write         # снять метку после ревью
      pull-requests: write  # снять метку после ревью
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # sonnet — алиас последней Sonnet: при выходе новой версии
          # ничего не нужно менять.
          claude_args: >-
            --model sonnet
            --max-turns 12
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      - name: Снять метку, чтобы ревью можно было запросить снова
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label claude-review
