name: Ревью от Claude

# Ревью по запросу: повесь на PR метку claude-review. После ревью метка
# снимается сама — чтобы попросить ещё раз после правок, повесь её снова.
#
# Не на каждый PR, потому что бот работает на подписке ментора, и лимит у неё
# общий с его собственной работой.
#
# Метка, а не команда в комментарии: на событие pull_request GitHub сам
# запускает workflow на коде PR, а PR из форков секретов не получают.
#
# Правила ревью — в .claude/skills/pr-review/SKILL.md. Своя команда вместо
# официального плагина code-review: плагин сам решает, «нужно ли ревью», и
# пропускал небольшие PR, а ещё запускает Opus-агентов, которые съедают лимит
# подписки.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write         # снять метку после ревью
      pull-requests: write  # снять метку после ревью
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-коммит PR и его родитель: дифф доступен и через git,
          # если gh внутри ревью не сработает
          fetch-depth: 2

      - uses: anthropics/claude-code-action@v1
        env:
          # gh внутри ревью: прочитать PR и оставить итоговый комментарий
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
          # sonnet — алиас последней Sonnet: при выходе новой версии
          # ничего не нужно менять. Остальные инструменты разрешает сам skill.
          claude_args: >-
            --model sonnet
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      - name: Снять метку, чтобы ревью можно было запросить снова
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label claude-review
