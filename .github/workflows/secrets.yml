name: Секреты

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ловит и забытый .env, и ключ, захардкоженный прямо в коде.
      # .gitignore от второго не спасает.
      - name: Поиск секретов в коде и истории
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            dir /repo --redact --no-banner --verbose
