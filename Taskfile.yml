version: "3"

vars:
  COVERAGE_MIN: 70
  SERVICES: identity catalog cart payment order

env:
  CGO_ENABLED: "0"

tasks:
  default:
    desc: Список доступных команд
    cmds:
      - task --list

  # ── инфраструктура ────────────────────────────────────────────────
  up:
    desc: Поднять инфраструктуру (Postgres, Redis, Redpanda, Prometheus, Grafana)
    cmds:
      - docker compose -f deploy/docker-compose.yml up -d
      - echo "Grafana → http://localhost:3000 (admin/admin)"

  down:
    desc: Остановить инфраструктуру
    cmds:
      - docker compose -f deploy/docker-compose.yml down

  clean:
    desc: Остановить инфраструктуру и удалить данные
    prompt: Удалить все тома с данными. Продолжить?
    cmds:
      - docker compose -f deploy/docker-compose.yml down -v

  logs:
    desc: 'Логи контейнера: task logs -- redpanda'
    cmds:
      - docker compose -f deploy/docker-compose.yml logs -f {{.CLI_ARGS}}

  # ── проверки ──────────────────────────────────────────────────────
  lint:
    desc: Линтер по всему репозиторию
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Отформатировать код
    cmds:
      - golangci-lint fmt ./...

  test:
    desc: Тесты с детектором гонок
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...

  cover:
    desc: Проверить порог покрытия бизнес-логики
    deps: [test]
    cmds:
      - ./scripts/coverage-gate.sh coverage.out {{.COVERAGE_MIN}}

  cover-html:
    desc: Открыть отчёт о покрытии
    deps: [test]
    cmds:
      - go tool cover -html=coverage.out

  check:
    desc: Всё, что проверяет CI — гоняй перед пушем
    cmds:
      - task: fmt
      - task: lint
      - task: cover

  # ── кодогенерация ─────────────────────────────────────────────────
  gen:
    desc: Сгенерировать protobuf и моки
    cmds:
      - task: gen:proto
      - task: gen:mocks

  gen:proto:
    desc: Сгенерировать код из .proto
    cmds:
      - buf lint
      - buf generate

  gen:mocks:
    desc: Сгенерировать моки интерфейсов
    cmds:
      - mockery

  # ── миграции ──────────────────────────────────────────────────────
  migrate:up:
    desc: 'Накатить миграции: task migrate:up -- example'
    cmds:
      - goose -dir services/{{.CLI_ARGS}}/migrations postgres "$(task --silent dsn -- {{.CLI_ARGS}})" up

  migrate:down:
    desc: 'Откатить одну миграцию: task migrate:down -- example'
    cmds:
      - goose -dir services/{{.CLI_ARGS}}/migrations postgres "$(task --silent dsn -- {{.CLI_ARGS}})" down

  migrate:new:
    desc: 'Новая миграция: task migrate:new -- example add_widgets_index'
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        goose -dir "services/$1/migrations" -s create "$2" sql

  dsn:
    internal: true
    silent: true
    cmds:
      - echo "postgres://gomarket:gomarket@localhost:5432/{{.CLI_ARGS}}?sslmode=disable"

  # ── инструменты ───────────────────────────────────────────────────
  tools:
    desc: Установить инструменты разработки
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - go install github.com/vektra/mockery/v3@latest
      - go install github.com/bufbuild/buf/cmd/buf@latest
