version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/go-trainee-techcore/go-market/proto/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: proto/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: proto/gen
    opt: paths=source_relative
