# 30s, а не 15s: на двух ядрах частый скрейп заметен в фоне.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gomarket-services
    # host.docker.internal — сервисы запускаются на хосте, а не в compose,
    # чтобы их можно было отлаживать из IDE.
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { service: example }
      - targets: ["host.docker.internal:8081"]
        labels: { service: identity }
      - targets: ["host.docker.internal:8082"]
        labels: { service: catalog }
      - targets: ["host.docker.internal:8083"]
        labels: { service: cart }
      - targets: ["host.docker.internal:8084"]
        labels: { service: payment }
      - targets: ["host.docker.internal:8085"]
        labels: { service: order }
