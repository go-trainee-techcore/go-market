openapi: 3.0.3
info:
  title: Cart API
  version: 1.0.0
  description: GoMarket Cart API
paths:
  /cart/{user_id}:
    get:
      summary: View cart contents
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Successfully retrieved the cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Invalid user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cart/{user_id}/items:
    post:
      summary: Adding an item to the cart
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Item successfully added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Data validation error or position limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Changing the quantity of an item in the cart
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Product quantity successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Incorrect number of request parameters or invalid parameter values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No items found in the cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Removing an item or clearing the cart
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - name: product_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The item or the entire cart has been successfully removed
        '400':
          description: Invalid identifier format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    UserIdParam:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: "d3b07384-d113-4ec2-a9f3-b3a1a74e5088"

  schemas:
    EntityMeta:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec2-a9f3-b3a1a74e5088"
        created_at:
          type: string
          format: date-time
          example: "2026-11-03T12:00:00Z"

    CartResponse:
      type: object
      required:
        - user_id
        - items
        - total_price
      properties:
        user_id:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec2-a9f3-b3a1a74e5088"
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total_price:
          type: integer
          description: Total value of all items in the smallest currency units
          example: 15000

    CartItem:
      allOf:
        - $ref: '#/components/schemas/EntityMeta'
        - type: object
          required:
            - product_id
            - quantity
            - price
          properties:
            product_id:
              type: string
              format: uuid
              example: "d3b07384-d113-4ec2-a9f3-b3a1a74e5088"
            quantity:
              type: integer
              minimum: 1
              maximum: 99
              example: 2
            price:
              type: integer
              example: 7500

    AddCartItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec2-a9f3-b3a1a74e5088"
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 1

    UpdateCartItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec2-a9f3-b3a1a74e5088"
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          example: 5

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "CART_LIMIT_EXCEEDED"
        message:
          type: string
          example: "Position limit in the basket exceeded"
