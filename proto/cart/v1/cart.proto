syntax = "proto3";

package cart.v1;

option go_package = "github.com/go-trainee-techcore/go-market/pkg/api/cart/v1;cartv1";

service CartService {
  rpc GetCartSnapshot(GetCartSnapshotRequest) returns (GetCartSnapshotResponse);
}

message CartItem {
  string product_id = 1;
  int32 quantity = 2;
  int64 price = 3;
}

message GetCartSnapshotRequest {
  string user_id = 1;
}

message GetCartSnapshotResponse {
  string user_id = 1;
  repeated CartItem items = 2;
  int64 total_price = 3;
}
